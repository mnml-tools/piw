name: Desktop builds

# Builds Linux, macOS and Windows packages on every push to main, on version tags and by hand.
# A version tag (vX.Y.Z matching the app version) also publishes a GitHub Release with every
# package and SHA256SUMS.txt, using the built-in GITHUB_TOKEN. Packages are unsigned.

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  # Never cancel a release build half-way.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  # Third-party actions are pinned to commit SHAs (comment = release tag).
  # Tag builds use no dependency caches: a poisoned cache must never reach a release.
  USE_CACHE: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.USE_CACHE == 'true'
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in shipped JS dependencies
        run: pnpm audit --prod
      - name: Frontend checks
        run: pnpm check
      - name: Frontend build
        run: pnpm build
      - name: Rust checks
        run: pnpm rust:check
      - name: TypeScript bindings are up to date
        run: git diff --exit-code -- src/lib/ipc/bindings

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the AppImage runs on more distributions.
          - platform: linux-x86_64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - platform: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-x86_64
            os: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf libfuse2 file xdg-utils
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.USE_CACHE == 'true'
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      - name: Release tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match the app version $version"
            exit 1
          fi
      # beforeBuildCommand also regenerates the third-party licence notices shipped in the package.
      - name: Build desktop packages
        run: pnpm tauri build --ci ${{ matrix.args }}
      - name: Collect packages
        run: |
          mkdir -p artifacts
          case "$RUNNER_OS" in
            Linux)
              cp src-tauri/target/release/bundle/deb/*.deb \
                src-tauri/target/release/bundle/rpm/*.rpm \
                src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
              ;;
            macOS)
              bundle=src-tauri/target/universal-apple-darwin/release/bundle
              ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Piw.app" \
                artifacts/Piw-macos-universal.app.zip
              cp "$bundle"/dmg/*.dmg artifacts/
              ;;
            Windows)
              cp src-tauri/target/release/bundle/nsis/*.exe \
                src-tauri/target/release/bundle/msi/*.msi artifacts/
              ;;
          esac
          ls -la artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Piw-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish version release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    # Add required reviewers to this environment (Settings → Environments) to gate releases.
    environment: release
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Piw-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=''
          case "$RELEASE_TAG" in v0.* | *-*) prerelease='--prerelease' ;; esac
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Piw $RELEASE_TAG" $prerelease --generate-notes \
              --notes "See CHANGELOG.md. Packages are unsigned; verify them with SHA256SUMS.txt before installing."
          fi
